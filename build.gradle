group 'com.markgravestock'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        mavenCentral()
    }
}

apply plugin: 'java'

repositories {
    mavenCentral()
}

dependencies {
    compile 'org.joda:joda-money:2.0.3'
    compile 'org.apache.commons:commons-lang3:3.20.0'
    testCompile 'org.jbehave:jbehave-core:5.2.0'
    testCompile 'org.mockito:mockito-core:1.+'
    testCompile group: 'junit', name: 'junit', version: '4.13.2'
}
